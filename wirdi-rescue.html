<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>إنقاذ بيانات وردي</title><style>body{font-family:system-ui,Tahoma,sans-serif;background:#f6f8f4;color:#174a3c;max-width:600px;margin:auto;padding:22px;line-height:1.8}main{background:white;border:1px solid #dfe9e1;padding:20px;border-radius:18px}button{background:#174a3c;color:white;padding:14px;border:0;border-radius:12px;font:inherit;width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eff6f0;padding:12px;border-radius:10px}small{color:#58685c}</style></head><body><main><h1>إنقاذ بيانات «وردي»</h1><p>هذه الصفحة تقرأ بيانات «وردي» من هذا المتصفح فقط. لا تغيّر ولا تمسح أي بيانات.</p><div id="status">جارٍ فحص السجل...</div><button id="download" disabled>تنزيل نسخة إنقاذ من البيانات</button><p><small>إن لم تظهر بياناتك، لا تمسح التطبيق. قد تكون محفوظة داخل نسخة أخرى من Chrome أو التطبيق المثبّت.</small></p></main><script>
(function(){'use strict';const KEY='wirdi_simple_review_v1';const status=document.getElementById('status');const button=document.getElementById('download');let raw=null;try{raw=localStorage.getItem(KEY);if(raw===null){status.textContent='لم أجد سجل «وردي» في مساحة التخزين الخاصة بهذه الصفحة. هذا لا يثبت حذفه من تطبيق مثبّت منفصل.';return;}let data=JSON.parse(raw);const archives=Array.isArray(data.archives)?data.archives:[];const records=Array.isArray(data.records)?data.records:[];const archivalRows=archives.reduce((sum,a)=>sum+(Array.isArray(a.records)?a.records.length:0),0);status.innerHTML='<p><strong>تم العثور على بيانات محفوظة.</strong></p><p>عدد الختمات المؤرشفة: '+archives.length+'</p><p>عدد أيام الختمة الحالية: '+records.length+'</p><p>عدد أيام مراجعة الختمات السابقة: '+archivalRows+'</p><p>رقم الختمة الحالية: '+(Number.isInteger(data.currentNumber)?data.currentNumber:'غير محدد')+'</p>';button.disabled=false;button.onclick=function(){const blob=new Blob([JSON.stringify({app:'wirdi-simple',version:3,...data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='wirdi-rescue-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)};}catch(e){status.textContent='وجدت بيانات لكنها غير قابلة للقراءة بصورة صحيحة. لا تحذف أو تستورد شيئًا. احتفظ بنسخة منها قبل محاولة الإصلاح.';if(raw!==null){button.disabled=false;button.textContent='حفظ البيانات الخام للإنقاذ';button.onclick=function(){const url=URL.createObjectURL(new Blob([raw],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='wirdi-rescue-raw.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}}}})();
</script></body></html>
